#  name = "首页"                          # 菜单名称
#  url = "/"                              # 链接地址
#  weight = 1                            # 排序权重（数字越小越靠前）

[[menu.main]]
  name = "归档 ⏱️"
  url = "/archives/"
  weight = 20

[[menu.main]]
  name = "分类 📂"
  url = "/categories/"
  weight = 30

[[menu.main]]
  name = "标签 🏷️"
  url = "/tags/"
  weight = 40

[[menu.main]]
  name = "搜索 🔍"
  url = "/search/"
  weight = 50

[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 60

# ================================================
# 参数配置
# ================================================
[params]
  # ---------- 基本信息 ----------
  env = "production"                   # 环境：production 启用 SEO 功能
  description = "技术分享、一起进步 | 网络技术 · AI自动化 · 脚本开发"    # 网站描述（SEO 用）
  author = "Wanzf"                      # 作者名称
  keywords = ["技术博客", "网络技术", "AI自动化", "脚本开发", "服务器搭建"]  # SEO 关键词


  # 显示分享按钮（文章底部）
  ShowShareButtons = true
    
  # 评论系统
  comments = true  # 启用评论


  #  网站图标Logo
  favicon = "/favicon.ico"
  favicon16x16 = "/favicon-16x16.png"
  favicon32x32 = "/favicon-32x32.png"
  apple_touch_icon = "/apple-touch-icon.png"

  # ---------- 主题模式 ----------
  # 可选值：light（浅色）/ dark（深色）/ auto（跟随系统）
  defaultTheme = "auto"
  # 是否禁用主题切换按钮：false = 启用，true = 禁用
  disableThemeToggle = false

  # ---------- 首页信息（Home-Info 模式）----------
  [params.homeInfoParams]
    Title = "优秀项目 🚀"
    Content = """
📖 **[基础英语词汇](/vocabulary/)** —— 基于 Ogden's Basic English 体系的 850 核心词汇学习工具。支持分类浏览、背诵模式、学习进度追踪。
> 💡 更多项目持续添加中...

<div class="newsletter-box">
  <div class="newsletter-title">📬 邮件订阅</div>
  <div class="newsletter-desc">新文章第一时间送达邮箱，无需手动刷新。</div>
  <form
    action="https://buttondown.com/api/emails/embed-subscribe/wanzf"
    method="post"
    onsubmit="window.open('https://buttondown.com/wanzf', 'popupwindow')"
    target="popupwindow"
    class="newsletter-form"
  >
    <input type="email" name="email" placeholder="your@email.com" required class="newsletter-input" />
    <input type="hidden" value="1" name="embed" />
    <button type="submit" class="newsletter-btn">订阅</button>
  </form>
</div>
"""

  

  # ---------- 社交图标 ----------
  # 图标名称参考：https://github.com/adityatelange/hugo-PaperMod/wiki/Icons

  [[params.socialIcons]]
    name = "QQ"
    url = "https://qm.qq.com/q/Reh5RKNLu8"

  [[params.socialIcons]]
    name = "Github"                    # 图标名称
    url = "https://github.com/wanzif"  # 链接地址

  [[params.socialIcons]]
    name = "Email"
    url = "mailto:193105425@qq.com"

  [[params.socialIcons]]
    name = "RSS"
    url = "/index.xml"


  [params.giscus]
    repo = "wanzif/MyBlog"
    repoId = "R_kgDOSfbyGQ"
    category = "Announcements"
    categoryId = "DIC_kwDOSfbyGc4C9dtm"
    mapping = "pathname"
    reactionsEnabled = 1
    emitMetadata = 0
    inputPosition = "top"
    theme = "preferred_color_scheme"
    lang = "zh-CN"
    loading = "lazy"
    crossorigin = "anonymous"


  # ---------- 功能开关（全部开启）----------
  # 显示阅读时间
  ShowReadingTime = true

  # 显示代码复制按钮
  ShowCodeCopyButtons = true

  # 显示分享按钮（文章底部）
  ShowShareButtons = true

  # 显示上/下篇文章导航
  ShowPostNavLinks = true

  # 显示面包屑导航
  ShowBreadCrumbs = true

  # 显示文章目录（Table of Contents）
  ShowToc = true
  # 文章目录是否默认展开：false = 折叠，true = 展开
  TocOpen = false

  # 显示分类
  showTaxonomyCats = true

  # 显示标签
  showTaxonomyTags = true

  # 搜索功能（通过 outputs.home 的 JSON 格式实现，无需额外开关）

  # ---------- 数学公式支持 ----------
  # 开启 LaTeX 数学公式渲染
  math = true

  # ---------- 编辑链接 ----------
  # 让读者可以点击跳转到 GitHub 编辑页面
  [params.editPost]
    URL = "https://github.com/wanzif/MyBlog/tree/main/content"
    Text = "编辑此页"
    appendFilePath = true              # 自动追加文件路径

  # ---------- Fuse.js 搜索配置 ----------
  # 本地搜索的匹配参数
  [params.fuseOpts]
    isCaseSensitive = false           # 是否区分大小写
    shouldSort = true                  # 是否排序结果
    location = 0                       # 匹配位置
    distance = 1000                    # 匹配距离
    threshold = 0.4                    # 匹配阈值
    minMatchCharLength = 2             # 最少匹配字符数
    keys = ["title", "permalink", "summary", "content"]  # 搜索的字段

# ================================================
# Markdown 渲染配置
# ================================================
[markup]
  # Goldmark 渲染器配置（Hugo 默认的 Markdown 渲染器）
  [markup.goldmark]
    # 渲染器配置
    [markup.goldmark.renderer]
      # 是否允许不安全的 HTML，true 表示允许
      # 用于支持在 Markdown 中嵌入 HTML 标签
      unsafe = true
    
    # 扩展配置
    [markup.goldmark.extensions]
      # 数学公式扩展配置
      [markup.goldmark.extensions.passthrough]
        # 是否启用，true 表示启用
        enable = true
        
        # 数学公式分隔符配置
        [markup.goldmark.extensions.passthrough.delimiters]
          # 块级数学公式分隔符
          block = [
            ["\\[", "\\]"],  # \[...\] 格式
            ["$$", "$$"]     # $$...$$ 格式
          ]
          
          # 行内数学公式分隔符
          inline = [
            ["\\(", "\\)"]   # \(...\) 格式
          ]

  # 代码高亮配置
  [markup.highlight]
    # noClasses = true 使用内联样式（不依赖主题 CSS 加载），保证高亮始终生效
    noClasses = true
    
    # 代码高亮主题：monokai 经典暗色风格，语言区分度高
    style = "monokai"
    
    # 启用代码围栏
    codeFences = true
    
    # 自动猜测语言
    guessSyntax = true
    
    # 显示行号
    lineNos = false
    
    # 行号起始数字
    lineNoStart = 1

# ------------------------------------------------------------
