# ================================================
# Hugo 配置文件 - PaperMod 主题完整配置
# 博客地址：https://wanzf.com
# 最后更新：2026-05-19
# ================================================

# 网站基础信息
baseURL = "https://wanzf.com/"          # 网站 URL
title = "Wanzf's Blog"                   # 网站标题
theme = "PaperMod"                      # 使用的主题
languageCode = "zh"                     # 语言代码
defaultContentLanguage = "zh"           # 默认内容语言
canonifyURLs = true                     # 规范化 URL

# Robots 协议 - 允许搜索引擎抓取
enableRobotsTXT = true

# 启用 Emoji 表情支持
enableEmoji = true

# 启用内联短代码
enableInlineShortcodes = true

# 分页设置 - 每页显示 10 篇文章
[pagination]
  pagerSize = 10

# ================================================
# 输出格式配置（搜索功能必需）
# ================================================
[outputs]
  home = ["HTML", "RSS", "JSON"]       # 首页输出 HTML + RSS + JSON

# ================================================
# 菜单配置
# ================================================
[[menu.main]]
  name = "首页"                          # 菜单名称
  url = "/"                              # 链接地址
  weight = 1                            # 排序权重（数字越小越靠前）

[[menu.main]]
  name = "归档"
  url = "/archives/"
  weight = 2

[[menu.main]]
  name = "分类"
  url = "/categories/"
  weight = 3

[[menu.main]]
  name = "标签"
  url = "/tags/"
  weight = 4

[[menu.main]]
  name = "搜索"
  url = "/search/"
  weight = 5

[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 6

# ================================================
# 参数配置
# ================================================
[params]
  # ---------- 基本信息 ----------
  env = "production"                   # 环境：production 启用 SEO 功能
  description = "技术分享、一起进步"    # 网站描述（SEO 用）
  author = "Wanzf"                      # 作者名称

  # ---------- 主题模式 ----------
  # 可选值：light（浅色）/ dark（深色）/ auto（跟随系统）
  defaultTheme = "auto"
  # 是否禁用主题切换按钮：false = 启用，true = 禁用
  disableThemeToggle = false

  # ---------- 首页信息（Home-Info 模式）----------
  [params.homeInfoParams]
    Title = "👋 Hello"
    Content = "Welcome to my blog!"

  # ---------- 社交图标 ----------
  # 图标名称参考：https://github.com/adityatelange/hugo-PaperMod/wiki/Icons
  [[params.socialIcons]]
    name = "Github"                    # 图标名称
    url = "https://github.com/wanzif"  # 链接地址

  [[params.socialIcons]]
    name = "Email"
    url = "193105425@qq.com"

  [[params.socialIcons]]
    name = "RSS"
    url = "/index.xml"

  # ---------- 功能开关（全部开启）----------
  # 显示阅读时间
  ShowReadingTime = true

  # 显示代码复制按钮
  ShowCodeCopyButtons = true

  # 显示分享按钮（文章底部）
  ShowShareButtons = true

  # 显示上/下篇文章导航
  ShowPostNavLinks = true

  # 显示面包屑导航
  ShowBreadCrumbs = true

  # 显示文章目录（Table of Contents）
  ShowToc = true
  # 文章目录是否默认展开：false = 折叠，true = 展开
  TocOpen = false

  # 显示分类
  showTaxonomyCats = true

  # 显示标签
  showTaxonomyTags = true

  # 开启搜索功能
  enableSearch = true

  # ---------- 数学公式支持 ----------
  # 开启 LaTeX 数学公式渲染
  math = true

  # ---------- 编辑链接 ----------
  # 让读者可以点击跳转到 GitHub 编辑页面
  [params.editPost]
    URL = "https://github.com/wanzif/MyBlog/tree/main/content"
    Text = "编辑此页"
    appendFilePath = true              # 自动追加文件路径

  # ---------- Fuse.js 搜索配置 ----------
  # 本地搜索的匹配参数
  [params.fuseOpts]
    isCaseSensitive = false           # 是否区分大小写
    shouldSort = true                  # 是否排序结果
    location = 0                       # 匹配位置
    distance = 1000                    # 匹配距离
    threshold = 0.4                    # 匹配阈值
    minMatchCharLength = 2             # 最少匹配字符数
    keys = ["title", "permalink", "summary", "content"]  # 搜索的字段

# ================================================
# Markdown 渲染配置
# ================================================
[markup]
  # Goldmark 渲染器配置（Hugo 默认的 Markdown 渲染器）
  [markup.goldmark]
    # 渲染器配置
    [markup.goldmark.renderer]
      # 是否允许不安全的 HTML，true 表示允许
      # 用于支持在 Markdown 中嵌入 HTML 标签
      unsafe = true
    
    # 扩展配置
    [markup.goldmark.extensions]
      # 数学公式扩展配置
      [markup.goldmark.extensions.passthrough]
        # 是否启用，true 表示启用
        enable = true
        
        # 数学公式分隔符配置
        [markup.goldmark.extensions.passthrough.delimiters]
          # 块级数学公式分隔符
          block = [
            ["\\[", "\\]"],  # \[...\] 格式
            ["$$", "$$"]     # $$...$$ 格式
          ]
          
          # 行内数学公式分隔符
          inline = [
            ["\\(", "\\)"]   # \(...\) 格式
          ]

  # 代码高亮配置
  [markup.highlight]
    # 是否禁用 CSS 类，false 表示使用 CSS 类
    # 设置为 false 可以自定义代码高亮样式
    noClasses = false
    
    # 代码高亮主题，onedark 是一个流行的深色主题
    # 其他可选主题：monokai、github、dracula 等
    style = "onedark"
    
    # 是否启用代码围栏，true 表示启用
    codeFences = true
    
    # 是否猜测代码语言，true 表示启用
    guessSyntax = true
    
    # 是否显示行号，true 表示显示
    # lineNos = true
    
    # 行号起始数字
    # lineNoStart = 1
    
    # 行号在表格中，true 表示启用
    # lineNumbersInTable = true
    
    # 是否启用锚点行号，true 表示启用
    # anchorLineNos = true

# ------------------------------------------------------------
# 网站地图配置（可选）
# ------------------------------------------------------------

# [sitemap]
#   changefreq = "weekly"      # 更新频率
#   filename = "sitemap.xml"   # 文件名
#   priority = 0.5             # 优先级


# ================================================
# RSS 配置
# ================================================
[mediaTypes]
  [mediaTypes."application/rss"]
    suffixes = ["xml"]

[outputFormats.RSS]
  mediaType = "application/rss"
  baseName = "index"